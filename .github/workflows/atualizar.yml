name: atualizar

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 em Brasília, depois da atualização da Câmara (~04:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependências Python
        run: uv sync

      - name: Testes Python
        run: uv run pytest

      - name: Baixar dados, validar e gerar os arquivos do site
        run: uv run python -m painel.cli

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Testes e build do site
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - name: Publicar no Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=painel-votacoes --branch=main
