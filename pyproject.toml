[project]
name = "painel"
version = "0.1.0"
description = "Painel de votações da Câmara dos Deputados"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["painel"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
